# Logrotate configuration for Aerosmart Gateway
# Install to: /etc/logrotate.d/aerosmart
#
# Uses copytruncate because the gateway keeps its log file open and does NOT
# reopen it on SIGHUP (it only handles SIGINT/SIGTERM). copytruncate rotates by
# copying the file and then truncating the original in place, so the running
# process keeps writing to the same inode. This works the same under systemd and
# SysVinit and needs no PID file.

/var/log/aerosmart.log {
    daily
    rotate 7
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
}
