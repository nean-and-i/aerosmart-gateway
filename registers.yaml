write_registers:
  - name: "luefterstufe"
    command_template: "130 5002 {value}"
    subscribe_topic: "dw/aerosmart/luefterstufe"
    topic: "aerosmart/lueftermode"
    min_value: 0
    max_value: 5
    verify_registers:
      - "luefterstatus"
      - "lueftermode"
    ha:
      name: "Aerosmart Lüfterstufe"
      command_topic: "dw/aerosmart/luefterstufe"

  - name: "boilerheizstab"
    command_template: "140 5036 {value}"
    subscribe_topic: "dw/aerosmart/boilerheizstab"
    topic: "aerosmart/boilerheizstabanforderungstatus"
    min_value: 0
    max_value: 1
    verify_registers:
      - "badplusstatus"
    ha:
      name: "Aerosmart Boiler Heizstab"
      command_topic: "dw/aerosmart/boilerheizstab"

derived_registers:
  - name: "zuluftabluftprozent"
    topic: "aerosmart/zuluftabluftprozent"
    formula: "round((zuluftumin / abluftumin) * 100, 1)"
    sources: ["zuluftumin", "abluftumin"]
    ha:
      name: "Aerosmart Zuluft/Abluft Prozent"
      unit: "%"

  - name: "co2luefterstufe4"
    topic: "aerosmart/co2luefterstufe4"
    formula: "round(co2luefterstufe3 * 1.2)"
    sources: ["co2luefterstufe3"]
    ha:
      name: "Aerosmart CO2 Lüfterstufe 4"
      unit: "ppm"

  - name: "beschattungtemp_adjusted"
    topic: "aerosmart/beschattungtemp_adjusted"
    formula: "beschattungtemp - 0.5 if beschattungaussentemp < aussentemp else beschattungtemp + 1"
    sources: ["beschattungtemp", "beschattungaussentemp", "aussentemp"]
    ha:
      name: "Aerosmart Beschattung Temp Adjustiert"
      unit: "°C"
      device_class: "temperature"