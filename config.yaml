# Aerosmart Gateway Configuration

serial:
  port: "/dev/ttyUSB0"
  baudrate: 115200
  bytesize: 8
  parity: "N"
  stopbits: 1

  # Software flow control is NOT supported by the serial driver, and never
  # has been. Setting it to true is reported as a warning at startup rather
  # than silently ignored, but it does nothing either way.
  xonxoff: false
  dsrdtr: false

  # How long a single read may block, in milliseconds. A read is also cut
  # short at the response deadline.
  read_timeout: 200

  # Total budget for one command/response exchange, in milliseconds. Unmatched
  # or stale frames are discarded within this window without re-sending.
  response_timeout: 300

  # The unit's control panel shares the bus. Before each command the gateway
  # waits until the line has been silent for bus_quiet_gap milliseconds, so it
  # does not transmit into one of the panel's frames, but never longer than
  # bus_quiet_max_wait.
  bus_quiet_gap: 20
  bus_quiet_max_wait: 100

  # Attempts per register operation, and the delay between them. This is the
  # only retry level in the stack, and it also pays for confirming readings:
  # a changed value is only trusted once a second read agrees, so there are
  # always at least 2 attempts. The delay is jittered by up to half again, so
  # retries do not stay in step with the panel. Worst case per register is
  # max(retries, 2) * (max(bus_quiet_gap, bus_quiet_max_wait) + response_timeout
  #                    + 1.5 * retry_backoff)
  #   = 3 * (100 + 300 + 150) = 1.65s.
  retries: 3
  retry_backoff: 100

  # A failed port is reopened by a single supervisor with this backoff, in
  # milliseconds. Reopening is reserved for real port errors (EIO, ENODEV):
  # it toggles DTR/RTS, which many devices treat as a reset.
  reopen_backoff: 500
  reopen_max_backoff: 30000
  health_check_interval: 1000

  # Upper bound on how long an in-flight write may hold reads off, so a lost
  # release can never wedge polling.
  write_priority_timeout: 10000

  # How long to wait after writing a register before reading it back. The unit
  # applies writes but does not reliably echo them, so the read-back of
  # state_from and verify_registers is what confirms a write took effect.
  write_settle_delay: 50

  # How long after a write to read the affected registers a second time. Some
  # values trail the command: 60ms after a stage change the actual fan stage
  # (130 1067) still reported the previous value, so the first read-back
  # publishes a number the unit is already moving away from. Repeated changes
  # restart this wait, so one read happens after they stop. Set to 0 to
  # disable the second read entirely.
  write_resettle_delay: 5000

mqtt:
  broker: "192.168.1.20"
  port: 1883
  username: "mqtt"
  password: "password"
  client_id: "aerosmart-gateway"
  qos: 1
  retain: true

  # Online/offline topic. Also registered as the MQTT last will, so an unclean
  # disconnect marks the gateway offline instead of leaving retained values
  # looking live. Defaults to "<device_id>/status".
  availability_topic: "aerosmart/status"

  # Bounds every broker interaction, in milliseconds. Publishes happen on the
  # serial read path, so an unbounded wait would stall polling if the broker
  # accepts TCP but stops acknowledging.
  op_timeout: 5000

  publish_retry_count: 3

  # Connection retry (used at startup; paho handles later reconnects itself).
  connect_retry_initial_delay_ms: 500
  connect_retry_max_delay_ms: 30000
  connect_retry_jitter_percent: 25

# Device ID, also used as the Home Assistant device identifier.
device_id: "aerosmart"

# Logging level: debug, info, warn, error
log_level: "info"

logging:
  # Log file path; empty or "-" disables file logging, which spares the SD card.
  log_file: "-"
  file_logging: false
  console_logging: true

# Read interval in seconds.
read_interval: 120

# Home Assistant MQTT Discovery
ha_discovery:
  enabled: true
  prefix: "homeassistant"

  # Seconds without an update before an entity is shown unavailable rather
  # than displaying a stale retained value. Defaults to 2.5x read_interval;
  # set to 0 to leave entities available indefinitely.
  expire_after: 300

  device_info:
    name: "Aerosmart Gateway"
    manufacturer: "Drexel und Weiss"
    model: "aerosmartPI"
    # sw_version: defaults to the application version if not set
