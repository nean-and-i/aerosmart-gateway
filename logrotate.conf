# Logrotate configuration for Aerosmart Gateway
# Install to: /etc/logrotate.d/aerosmart

/var/log/aerosmart.log {
    daily
    rotate 7
    compress
    delaycompress
    missingok
    notifempty
    create 0640 root root
    sharedscripts
    postrotate
        if [ -f /var/run/aerosmart.pid ]; then
            kill -HUP $(cat /var/run/aerosmart.pid) 2>/dev/null || true
        fi
    endscript
}
